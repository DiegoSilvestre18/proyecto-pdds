server {
    listen 80;
    server_name _; # Responde a cualquier dominio o dirección IP

    # ==========================================
    # 1. FRONTEND: Archivos estáticos de React
    # ==========================================
    location / {
        # ¡ATENCIÓN!: Cambia la ruta absoluta de abajo para apuntar 
        # a donde clonaste el repositorio en tu VM.
        root /home/1inf54.982.4d/proyecto-pdds/frontend/dist;
        
        index index.html;
        # Esto permite que el enrutamiento de React (react-router-dom) funcione
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # 2. BACKEND: Proxy para la API REST
    # ==========================================
    location /api/ {
        # Removido el '/' al final para que mantenga el '/api/' en la ruta original
        proxy_pass http://localhost:8081;
        
        # Pasar cabeceras útiles para que Spring Boot conozca al cliente real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 3. BACKEND: Proxy para WebSockets (STOMP/SockJS)
    # ==========================================
    location /ws/ {
        # Todo lo que empiece con /ws/ será enviado al puerto 8081/ws/
        proxy_pass http://localhost:8081/ws/;
        
        # Cabeceras requeridas para establecer la conexión WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # Aumentar timeout (en segundos) para evitar que Nginx cierre conexiones inactivas
        proxy_read_timeout 86400; 
        proxy_send_timeout 86400;
    }
}
