services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdds-backend
    environment:
      - APP_CORS_ALLOWED_ORIGINS=*
    ports:
      # Exponemos el contenedor en el puerto 8081 para no chocar con el Tomcat en el 8080
      - "8081:8080"
    restart: unless-stopped
    volumes:
      # Mapeamos la carpeta "data" de tu código al contenedor para que Java encuentre los .txt
      - ./backend/data:/app/data
